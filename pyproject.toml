[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "rvd-railbench"
dynamic = ["version"]
description = "Rail-based ground testbed for spacecraft rendezvous and docking, with the RVDLAB terminal interface"
requires-python = ">=3.10"
dependencies = ["textual>=8.2"]

[project.scripts]
rvdlab = "rvdlab.__main__:main"

[project.urls]
Repository = "https://github.com/Strtus/rvd-railbench"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["rail_main", "rail_replay"]
cmake.build-type = "Release"
cmake.define.BUILD_TESTING = "OFF"
wheel.packages = ["tui/rvdlab"]
wheel.install-dir = "rvdlab/runtime"
wheel.py-api = "py3"
sdist.exclude = [".github", "docs", "golden", "tests", "tools", "tui/tests", "install.sh", "install.ps1", "*.zip"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(rvd_railbench VERSION (?P<value>[0-9.]+)'

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
inherit.cmake.define = "append"
cmake.define.CMAKE_EXE_LINKER_FLAGS = "-static-libstdc++ -static-libgcc"

[tool.cibuildwheel]
build = "cp312-*"  # the wheel is py3-none-<platform>; one build per platform
archs = ["auto64"]
skip = "*-musllinux_*"
test-command = "rvdlab --check"
