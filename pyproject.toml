[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "rvd-railbench"
dynamic = ["version"]
description = "RVDLAB: open-source infrastructure for spacecraft rendezvous and docking experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Strtus" }]
keywords = ["spacecraft", "rendezvous", "docking", "rail-testbed", "simulation", "experiment-control"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["textual>=8.2"]

[project.optional-dependencies]
node = ["cryptography>=42"]

[project.scripts]
rvdlab = "rvdlab.__main__:main"
rail-node = "rvd_railnode.cli:main"

[project.urls]
Homepage = "https://rvdlab.strtus.uk/"
Documentation = "https://rvdlab.strtus.uk/docs"
Repository = "https://github.com/Strtus/rvd-railbench"
Issues = "https://github.com/Strtus/rvd-railbench/issues"
Changelog = "https://github.com/Strtus/rvd-railbench/releases"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["rail_main", "rail_replay"]
cmake.build-type = "Release"
cmake.define.BUILD_TESTING = "OFF"
wheel.packages = ["tui/rvdlab", "node/rvd_railnode"]
wheel.install-dir = "rvdlab/runtime"
wheel.py-api = "py3"
sdist.exclude = [".github", "docs", "golden", "tests", "tools", "tui/tests", "node/tests", "install.sh", "install.ps1", "*.zip"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(rvd_railbench VERSION (?P<value>[0-9.]+)'

[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
inherit.cmake.define = "append"
cmake.define.CMAKE_EXE_LINKER_FLAGS = "-static-libstdc++ -static-libgcc"

[tool.cibuildwheel]
build = "cp312-*"  # the wheel is py3-none-<platform>; one build per platform
archs = ["auto64"]
skip = "*-musllinux_*"
test-command = "rvdlab --check && rail-node --version"
