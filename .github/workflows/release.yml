name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "install.sh", "install.ps1"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: rvd-railbench-linux-x64.tar.gz
          - os: windows-2022
            asset: rvd-railbench-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          else
            cmake --preset release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          fi
      - run: cmake --build --preset release --parallel 2
      - run: ctest --preset release
      - name: Package
        shell: bash
        run: |
          stage="$RUNNER_TEMP/rvd-railbench"
          mkdir -p "$stage"
          git archive --format=tar HEAD | tar -x -C "$stage"
          mkdir -p "$stage/build/release"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "build/release/rail_main$ext" "build/release/rail_replay$ext" "$stage/build/release/"
          "$stage/build/release/rail_main$ext" --help > /dev/null
          cd "$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${{ matrix.asset }}" rvd-railbench > /dev/null
          else
            tar -czf "${{ matrix.asset }}" rvd-railbench
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "RVD-RailBench ${GITHUB_REF_NAME#v}" --generate-notes
