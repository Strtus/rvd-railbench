name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "install.ps1"
      - "pyproject.toml"
      - "README.md"
      - "CMakeLists.txt"
      - "tui/runtime.json.in"
      - "tui/rvdlab/**"
      - "node/rvd_railnode/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: rvd-railbench-linux-x64.tar.gz
          - os: windows-2022
            asset: rvd-railbench-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          else
            cmake --preset release "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          fi
      - run: cmake --build --preset release --parallel 2
      - run: ctest --preset release
      - name: Package
        shell: bash
        run: |
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          stage="$temp/rvd-railbench"
          mkdir -p "$stage"
          git archive --format=tar HEAD | tar -x -C "$stage"
          mkdir -p "$stage/build/release"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "build/release/rail_main$ext" "build/release/rail_replay$ext" "$stage/build/release/"
          "$stage/build/release/rail_main$ext" --help > /dev/null
          cd "$temp"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${{ matrix.asset }}" rvd-railbench > /dev/null
          else
            tar -czf "${{ matrix.asset }}" rvd-railbench
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cibuildwheel twine
      - run: python -m cibuildwheel --output-dir wheelhouse
      - run: python -m twine check --strict wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "RVD-RailBench ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  # Runs once PyPI trusts this workflow (pending publisher: rvd-railbench, environment pypi) and the
  # repository variable PYPI_PUBLISH is set to true.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
