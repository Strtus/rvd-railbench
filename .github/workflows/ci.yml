name: C++ CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        preset: [dev, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - run: ctest --preset ${{ matrix.preset }}
      - run: cmake --preset minimal
      - run: cmake --build --preset minimal --parallel 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.preset }}
          path: build/*/Testing/Temporary/

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18
      - run: python3 tools/check_format.py
      - run: cmake --preset dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: run-clang-tidy-18 -p build/dev -quiet 'src/(core|control|runtime|simulation)/'

  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel 2
      - run: python -m pip install ./node "./tui[test]"
      - run: python -m pytest tui/tests -q

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./node[test]"
      - run: python -m pytest node/tests -q

  onnx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up optional ONNX Runtime 1.20.1
        run: |
          archive="$RUNNER_TEMP/onnxruntime.nupkg"
          ort_root="$RUNNER_TEMP/onnxruntime"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.20.1/microsoft.ml.onnxruntime.1.20.1.nupkg
          echo "9c32108e9a1c78b090a95c2a219f244dd5f067d4caf68fb0f967103f3f20839c  $archive" | sha256sum -c -
          mkdir -p "$ort_root"
          cd "$ort_root"
          cmake -E tar xf "$archive" -- build/native/include runtimes/linux-x64/native
          mv build/native/include include
          mv runtimes/linux-x64/native lib
          ln -s libonnxruntime.so lib/libonnxruntime.so.1
      - run: cmake -S . -B build/onnx -G Ninja -DCMAKE_BUILD_TYPE=Release -DRVD_ENABLE_ONNX=ON -DONNXRUNTIME_ROOT="$RUNNER_TEMP/onnxruntime"
      - run: cmake --build build/onnx --parallel 2
      - run: ctest --test-dir build/onnx --output-on-failure
